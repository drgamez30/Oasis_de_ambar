<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frescas | Oasis de Ámbar</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/frescas.css">

    <link rel="stylesheet" href="css/ui.css">

<body>

    <!-- =========================================
    HEADER
    ========================================= -->

    <header>

        <a href="index.html" class="logo">
            Oasis de Ámbar
        </a>

        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="frescas.html" class="active">
                Frescas
            </a>

        </nav>

    </header>

    <!-- =========================================
    TOP SECTION
    ========================================= -->

    <section class="top-section">

        <span>
            Colección exclusiva
        </span>

        <h1>
            Aromas Frescos
        </h1>

        <p>
            Fragancias limpias, ligeras y modernas.
        </p>

    </section>

    <!-- =========================================
    PRODUCTOS
    ========================================= -->

    <section class="productos">

        <div class="view-controls" aria-label="Tamaño de productos">

            <button type="button" data-view-size="small">
                Pequeño
            </button>

            <button type="button" class="active" data-view-size="medium">
                Mediano
            </button>

            <button type="button" data-view-size="large">
                Grande
            </button>

        </div>

        <div class="productos-container view-medium">

            <!-- PRODUCTO -->

            <div class="producto-card">

                <div class="producto-img producto1"></div>

                <div class="producto-info">

                    <h3>
                        Aqua Pure
                    </h3>

                    <p>
                        Sensación limpia, fresca y ligera.
                    </p>

                    <button>
                        Cotizar
                    </button>

                </div>

            </div>

            <!-- PRODUCTO -->

            <div class="producto-card">

                <div class="producto-img producto2"></div>

                <div class="producto-info">

                    <h3>
                        Blue Air
                    </h3>

                    <p>
                        Aroma moderno con energía suave.
                    </p>

                    <button>
                        Cotizar
                    </button>

                </div>

            </div>

            <!-- PRODUCTO -->

            <div class="producto-card">

                <div class="producto-img producto3"></div>

                <div class="producto-info">

                    <h3>
                        Clean Mist
                    </h3>

                    <p>
                        Frescura limpia para todos los días.

                        Cotizar

            </div>

            <!-- PRODUCTO -->

            <div class="producto-card">

                <div class="producto-img producto4"></div>

                <div class="producto-info">

                    <h3>
                        Ocean Glow
                    </h3>

                    <p>
                        Ligero, luminoso y muy versátil.
                    </p>

                    <button>
                        Cotizar
                    </button>

                </div>

            </div>

        </div>

    </section>

    <button class="back-to-top" type="button" aria-label="Volver arriba">
        ↑

    <script src="js/site-ui.js"></script>
